<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- This line makes the page fit phone screens properly -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SA Talking Calculator</title>

  <!-- Connect our CSS file -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="calculator">

    <!-- Title -->
    <header class="calc-header">
      <h1>SA <span>Talking</span> Calculator</h1>
    </header>

    <!-- Display screen -->
    <section class="display">
      <div id="expression" class="expression"></div>
      <div id="result" class="result">0</div>
    </section>

    <!-- Keypad -->
    <section class="keypad">
      <button class="btn btn-action" data-action="clear">AC</button>
      <button class="btn btn-action" data-action="delete">DEL</button>
      <button class="btn btn-operator" data-value="%">%</button>
      <button class="btn btn-operator" data-value="/">÷</button>

      <button class="btn" data-value="7">7</button>
      <button class="btn" data-value="8">8</button>
      <button class="btn" data-value="9">9</button>
      <button class="btn btn-operator" data-value="*">×</button>

      <button class="btn" data-value="4">4</button>
      <button class="btn" data-value="5">5</button>
      <button class="btn" data-value="6">6</button>
      <button class="btn btn-operator" data-value="-">−</button>

      <button class="btn" data-value="1">1</button>
      <button class="btn" data-value="2">2</button>
      <button class="btn" data-value="3">3</button>
      <button class="btn btn-operator" data-value="+">+</button>

      <button class="btn btn-zero" data-value="0">0</button>
      <button class="btn" data-value=".">.</button>
      <button class="btn btn-equals" data-action="equals">=</button>
    </section>

  </main>

  <!-- Connect our JavaScript file -->
  <script src="script.js"></script>
</body>
</html>
